<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>拼字測驗</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
  <div class="top">
    <a class="back" id="backLink" href="vocab.html">‹</a>
    <div><h1 id="title">✏️ 拼字測驗</h1><div class="sub" id="subtitle"></div></div>
  </div>

  <div id="stage">
    <div class="fc-count" id="counter"></div>
    <div class="card center">
      <div class="fc-word" id="zhWord" style="font-size:1.8rem"></div>
      <div class="fc-pos muted" id="zhPos" style="margin:6px 0 16px"></div>
      <input class="spell-input" id="input" type="text" autocomplete="off" autocapitalize="off"
             autocorrect="off" spellcheck="false" placeholder="輸入英文">
      <div id="feedback" class="explain hidden" style="text-align:left"></div>
      <div style="height:14px"></div>
      <button class="btn primary" id="btnCheck">檢查</button>
    </div>
  </div>

  <div id="done" class="hidden">
    <div class="card center">
      <div style="font-size:3rem">✏️</div>
      <div class="score-big" id="doneStat"></div>
      <div class="score-sub" id="doneSub"></div>
      <button class="btn primary" onclick="location.reload()">再測一次</button>
      <div style="height:10px"></div>
      <a class="btn ghost" id="doneBack" href="vocab.html">回單字列表</a>
    </div>
  </div>
</main>
<script src="data/words.js"></script>
<script src="js/app.js"></script>
<script>
(function(){
  const set = WORD_SETS.find(s => s.id === qs("set")) || WORD_SETS[0];
  $("#title").textContent = `✏️ 拼字測驗`;
  $("#subtitle").textContent = `${set.icon} ${set.name}`;
  const N = 10;
  const quiz = sampleN(set.words.map((w,i)=>({en:w[0],zh:w[1],pos:w[2],idx:i})), N);
  let cur = 0, right = 0, checked = false;

  function norm(s){ return s.trim().toLowerCase().replace(/\s+/g," "); }

  function render(){
    const w = quiz[cur];
    $("#counter").textContent = `${cur+1} / ${quiz.length}`;
    $("#zhWord").textContent = w.zh;
    $("#zhPos").textContent = w.pos;
    $("#input").value = "";
    $("#input").disabled = false;
    $("#feedback").classList.add("hidden");
    $("#btnCheck").textContent = "檢查";
    checked = false;
    $("#input").focus();
  }
  function check(){
    if (checked){ nextQ(); return; }
    const w = quiz[cur];
    const ok = norm($("#input").value) === norm(w.en);
    const fb = $("#feedback");
    fb.classList.remove("hidden","good","bad");
    fb.classList.add(ok ? "good" : "bad");
    fb.innerHTML = ok
      ? `✅ 正確！<b>${esc(w.en)}</b>`
      : `❌ 正確答案是 <b>${esc(w.en)}</b>`;
    if (ok) right++;
    else {
      // 拼錯的字加入不熟清單
      const v = getVocab(set.id);
      v.hard[w.idx] = true;
      delete v.known[w.idx];
      setVocab(set.id, v);
    }
    speak(w.en);
    checked = true;
    $("#input").disabled = true;
    $("#btnCheck").textContent = cur === quiz.length-1 ? "看結果" : "下一題";
  }
  function nextQ(){
    cur++;
    if (cur >= quiz.length){
      $("#stage").classList.add("hidden");
      $("#done").classList.remove("hidden");
      $("#doneStat").textContent = `${right} / ${quiz.length}`;
      $("#doneSub").textContent = right === quiz.length ? "全對！拼字大師！" : "拼錯的字已加入複習清單";
      return;
    }
    render();
  }
  $("#btnCheck").onclick = check;
  $("#input").addEventListener("keydown", e => { if (e.key === "Enter") check(); });
  render();
})();
</script>
</body>
</html>
