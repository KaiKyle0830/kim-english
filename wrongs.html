<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>錯題本</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
  <div class="top">
    <a class="back" href="index.html">‹</a>
    <div><h1>📕 錯題本</h1><div class="sub">答對就會自動從錯題本移除</div></div>
  </div>
  <div class="card" id="list"></div>
</main>
<script src="data/words.js"></script>
<script src="data/easy.js"></script>
<script src="data/school.js"></script>
<script src="js/units.js"></script>
<script src="data/report-config.js"></script>
<script src="js/app.js"></script>
<script>
(function(){
  const rows = allUnits().map(u => {
    const n = getWrongs(u.id).length;
    if (!n) return "";
    return `<a class="row" href="unit.html?u=${u.id}&mode=wrongs">
      <span style="font-size:1.5rem">${u.icon}</span>
      <span style="flex:1"><b>${u.isSchool ? "學校 " + u.name : "Unit " + u.no + "｜" + u.name}</b></span>
      <span class="badge">${n} 題</span>
    </a>`;
  }).join("");
  $("#list").innerHTML = rows || `<div class="center muted" style="padding:24px">
    目前沒有錯題 🎉<br><span class="small">文法測驗答錯的題目會自動收集在這裡</span></div>`;
})();
</script>
</body>
</html>
