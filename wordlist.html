<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>單字表</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
  <div class="top">
    <a class="back" id="backLink" href="vocab.html">‹</a>
    <div><h1 id="title">單字表</h1><div class="sub" id="subtitle"></div></div>
  </div>

  <a class="btn primary" id="cardBtn">🃏 Word Card（字卡練習）</a>
  <div style="height:10px"></div>
  <a class="btn ghost" id="quizBtn">📝 考這 10 個字</a>

  <div class="card" style="margin-top:14px">
    <div class="muted small center" style="margin-bottom:6px">點 🔊 聽單字，點例句聽整句</div>
    <div id="list"></div>
  </div>
</main>
<script src="data/words.js"></script>
<script src="data/easy.js"></script>
<script src="data/school.js"></script>
<script src="js/units.js"></script>
<script src="data/report-config.js"></script>
<script src="data/audio.js"></script>
<script src="js/app.js"></script>
<script>
(function(){
  const set = findSet(qs("set")) || WORD_SETS[0];
  const p = qs("p");
  const words = lessonWords(set, p);
  const v = getVocab(set.id);
  const known = knownIn(set.id, words);
  const suffix = p ? `&p=${p}` : "";
  $("#title").textContent = `${set.icon} ${set.name}`;
  $("#subtitle").textContent = (p ? `第 ${p} 篇・` : "") + `${words.length} 個字・已認識 ${known} 個`;
  $("#backLink").href = `lessons.html?set=${set.id}`;
  $("#cardBtn").href = `cards.html?set=${set.id}${suffix}`;
  $("#quizBtn").href = `vocabquiz.html?set=${set.id}${suffix}`;
  if (!p) $("#quizBtn").textContent = "📝 這個主題的單字考試";

  // 例句「English. 中文。」拆成兩行顯示
  function splitEx(ex){
    const m = ex.match(/^(.*?)\s*([一-鿿，。！？].*)$/);
    return m ? [m[1], m[2]] : [ex, ""];
  }

  $("#list").innerHTML = words.map(w => {
    const [en, zh] = splitEx(w.ex);
    return `<div class="wl-item">
      <div class="wl-head">
        <span class="wl-en">${esc(w.en)}</span>
        ${w.kk ? `<span class="wl-pos" style="font-family:'Times New Roman',serif">[${esc(w.kk)}]</span>` : ""}
        <span class="wl-pos">${esc(w.pos)}</span>
        ${v.known[w.idx] ? '<span class="wl-known">✓</span>' : ''}
        <span class="wl-zh">${esc(w.zh)}</span>
        <button class="wl-speak" data-say="${esc(w.en)}" aria-label="唸單字">🔊</button>
      </div>
      <div class="wl-ex" data-say="${esc(en)}"><b>${esc(en)}</b><br>${esc(zh)}</div>
    </div>`;
  }).join("");

  $$("[data-say]").forEach(el => el.onclick = e => {
    e.preventDefault();
    speak(el.dataset.say);
  });
})();
</script>
</body>
</html>
