<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>學文法</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
  <div class="top">
    <a class="back" href="index.html">‹</a>
    <div><h1>📖 學文法</h1><div class="sub">先看重點複習，再挑戰隨機 20 題</div></div>
  </div>
  <div class="card" id="unitList"></div>
</main>
<script src="data/words.js"></script>
<script src="data/easy.js"></script>
<script src="data/school.js"></script>
<script src="js/units.js"></script>
<script src="data/report-config.js"></script>
<script src="js/app.js"></script>
<script>
(function(){
  $("#unitList").innerHTML = UNITS.map(u => {
    const h = getQuizHistory(u.id);
    const best = h.length ? Math.max(...h.map(r => Math.round(r.s/r.t*100))) : null;
    const passed = best !== null && best >= 80;
    const badge = best === null ? "尚未測驗" : `最高 ${best} 分`;
    return `<a class="row" href="unit.html?u=${u.id}">
      <span style="font-size:1.5rem">${u.icon}</span>
      <span style="flex:1">
        <b>Unit ${u.no}｜${u.name}</b>
        <div class="muted small" style="margin-top:2px">${u.brief}</div>
      </span>
      <span class="badge ${passed?"done":""}">${passed?"✓ ":""}${badge}</span>
    </a>`;
  }).join("");
})();
</script>
</body>
</html>
