<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>學單字</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
  <div class="top">
    <a class="back" href="index.html">‹</a>
    <div><h1>📚 學單字</h1><div class="sub">每篇 10 個字・點 🎯 設為目標</div></div>
  </div>
  <div class="card" id="setList"></div>
</main>
<script src="data/words.js"></script>
<script src="data/easy.js"></script>
<script src="data/school.js"></script>
<script src="js/units.js"></script>
<script src="data/report-config.js"></script>
<script src="js/app.js"></script>
<script>
(function(){
  const list = $("#setList");
  function render(){
    const goal = getGoalSet();
    list.innerHTML = WORD_SETS.map(s => {
      const learn = learnWords(s);
      const known = knownIn(s.id, learn);
      const done = known >= learn.length;
      const isGoal = s.id === goal;
      const lessons = lessonsOf(s).length;
      return `<a class="row" href="lessons.html?set=${s.id}" ${isGoal?'style="background:rgba(79,109,245,.07);border-radius:12px"':''}>
        <span style="font-size:1.5rem">${s.icon}</span>
        <span style="flex:1">
          <b>${s.name}</b>${isGoal?' <span class="badge" style="background:rgba(79,109,245,.15);color:var(--accent)">🎯 目標</span>':''}
          <div class="muted small" style="margin-top:2px">${lessons} 篇</div>
          <div class="pbar" style="margin-top:6px"><i style="width:${(known/learn.length*100).toFixed(0)}%"></i></div>
        </span>
        <span class="badge ${done?"done":""}">${known}/${learn.length}</span>
        <button class="goalBtn" data-id="${s.id}" aria-label="設為目標"
          style="font-size:1.2rem;padding:8px;opacity:${isGoal?1:.35}">🎯</button>
      </a>`;
    }).join("");
    $$(".goalBtn").forEach(b => b.onclick = e => {
      e.preventDefault(); e.stopPropagation();
      setGoalSet(b.dataset.id === getGoalSet() ? null : b.dataset.id);
      render();
    });
  }
  render();
})();
</script>
</body>
</html>
